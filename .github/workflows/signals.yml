name: Gold signals

on:
  schedule:
    # Every 15 min at :02, :17, :32, :47 (UTC), Monday to Friday
    - cron: "2,17,32,47 * * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a Telegram test message instead of scanning"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gold-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run signal scan
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python signals.py ${{ inputs.test && 'test' || '' }}
      - name: Save state and log
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          for f in state.json signals_log.csv calendar.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          git diff --cached --quiet || (git commit -m "Update signals" && git push)
